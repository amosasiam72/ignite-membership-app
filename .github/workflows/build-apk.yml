name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore android/igneite-chapel.keystore \
            -alias ignite-chapel -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ignite2024 -keypass ignite2024 \
            -dname "CN=Ignite Chapel, OU=Media, O=Ignite Chapel, L=City, ST=State, C=NG"

      - name: Build APK
        run: |
          bubblewrap init --manifest=twa-manifest.json --skipPwaValidation
          bubblewrap build --skipSigning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ignite-chapel-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
